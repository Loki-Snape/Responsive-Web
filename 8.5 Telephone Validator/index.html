<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muggle Telephone Validator</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="parchment-container">
    <header>
      <h1>Ministry of Magic</h1>
      <h2>Muggle Artifact Office: Telephone Validator</h2>
    </header>

    <main>
      <p class="instructions">Enter a Muggle telecommunication sequence below to verify its structural integrity according to the United States standard.</p>
      
      <div class="input-group">
        <label for="user-input">Comm-Sequence:</label>
        <input type="text" id="user-input" placeholder="e.g. 1 (555) 555-5555" />
      </div>

      <div class="button-group">
        <button id="check-btn" class="magic-btn">Veritas</button>
        <button id="clear-btn" class="magic-btn clear-btn">Evanesco</button>
      </div>

      <div id="results-div"></div>
    </main>

    <footer>
      <p>Approved by Arthur Weasley</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
